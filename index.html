@import url('https://fonts.googleapis.com/css2?family=Baloo+Bhaina+2:wght@500;700;800&family=Noto+Sans+Oriya:wght@400;600;700&display=swap');

.ab{
  --clay:#A8352A; --clay-dk:#7E2419; --rice:#F6EEDD; --rice-dk:#EADFC6;
  --ink:#241C16; --bark:#6B4A2F; --indigo:#2E5A78; --turmeric:#DE9B33;
  --leaf:#4F7A38; --chalk:#FFF8EA;
  min-height:100vh; background:var(--rice); color:var(--ink);
  font-family:'Noto Sans Oriya','Baloo Bhaina 2',system-ui,sans-serif;
  background-image:
    radial-gradient(circle at 12px 12px, rgba(168,53,42,.07) 1.5px, transparent 1.6px),
    radial-gradient(circle at 36px 36px, rgba(46,90,120,.06) 1.5px, transparent 1.6px);
  background-size:48px 48px;
}
.ab-wrap{max-width:520px;margin:0 auto;padding:0 16px 56px;}

.ab-card{
  background:var(--chalk); border:2.5px solid var(--ink); border-radius:18px;
  box-shadow:5px 5px 0 var(--ink); transition:transform .12s ease, box-shadow .12s ease;
  width:100%; text-align:left; cursor:pointer; display:block;
}
.ab-card:active{transform:translate(4px,4px); box-shadow:1px 1px 0 var(--ink);}
.ab-card:disabled{opacity:.45; box-shadow:3px 3px 0 var(--ink); cursor:not-allowed;}
.ab-card:focus-visible, .ab-btn:focus-visible, .ab-icon:focus-visible{
  outline:3px solid var(--indigo); outline-offset:3px;
}

.ab-band{
  background:var(--clay); margin:0 -16px 20px; padding:14px 16px 18px;
  border-bottom:3px solid var(--ink); position:relative;
}
.ab-band::after{
  content:""; position:absolute; left:0; right:0; bottom:5px; height:6px;
  background-image:repeating-linear-gradient(90deg,var(--chalk) 0 9px,transparent 9px 18px);
  opacity:.75;
}
.ab-brand{
  font-family:'Baloo Bhaina 2',cursive; font-weight:800; font-size:20px;
  color:var(--chalk); letter-spacing:.3px; line-height:1;
}
.ab-sub{color:rgba(255,248,234,.82); font-size:12px; margin-top:3px;}
.ab-icon{
  background:rgba(255,248,234,.18); border:2px solid var(--chalk); color:var(--chalk);
  border-radius:12px; padding:7px; display:inline-flex; cursor:pointer;
}
.ab-icon:active{background:rgba(255,248,234,.35);}

.ab-h1{font-family:'Baloo Bhaina 2',cursive; font-weight:800; font-size:26px; line-height:1.2; margin:0;}
.ab-h2{font-family:'Baloo Bhaina 2',cursive; font-weight:700; font-size:19px; margin:0;}
.ab-odia{color:var(--bark); font-size:15px;}
.ab-eyebrow{font-size:11px; letter-spacing:.16em; text-transform:uppercase; color:var(--bark); font-weight:700;}
.ab-btn{
  border:2.5px solid var(--ink); border-radius:14px; box-shadow:4px 4px 0 var(--ink);
  background:var(--clay); color:var(--chalk); font-weight:700; padding:13px 18px;
  font-size:15px; cursor:pointer; display:inline-flex; align-items:center;
  justify-content:center; gap:8px; font-family:inherit;
}
.ab-btn:active{transform:translate(3px,3px); box-shadow:1px 1px 0 var(--ink);}
.ab-btn.ghost{background:var(--chalk); color:var(--ink);}
.ab-btn.ink{background:var(--indigo);}
.ab-field{
  width:100%; border:2px solid var(--ink); border-radius:11px; padding:10px;
  background:var(--chalk); font-family:inherit; font-size:14px; color:var(--ink);
}
.ab-mono{
  font-family:ui-monospace,SFMono-Regular,Menlo,monospace; font-size:12px;
  background:var(--rice-dk); border:2px solid var(--ink); border-radius:11px;
  padding:10px; width:100%; color:var(--ink);
}

/* SIGNATURE: the setu itself \u2014 planks laid as the child crosses */
.ab-bridge{position:relative; height:52px; margin:6px 0 22px;}
.ab-deck{position:absolute; left:26px; right:26px; top:26px; height:12px; display:flex; gap:3px;}
.ab-plank{
  flex:1; border:2px solid var(--ink); border-radius:3px; background:transparent;
  border-style:dashed; transition:background .3s ease, border-style .3s ease;
}
.ab-plank.laid{background:var(--turmeric); border-style:solid;}
.ab-plank.now{background:var(--chalk); border-style:solid;}
.ab-pier{
  position:absolute; bottom:0; width:22px; height:34px; background:var(--bark);
  border:2.5px solid var(--ink); border-radius:4px 4px 0 0;
}
.ab-pier.l{left:2px;} .ab-pier.r{right:2px;}
.ab-pier span{position:absolute; top:-19px; left:50%; transform:translateX(-50%); font-size:15px;}
.ab-walker{position:absolute; top:-2px; font-size:22px; transition:left .45s cubic-bezier(.5,1.6,.5,1);}

.ab-tile-emoji{font-size:52px; line-height:1;}
.ab-clip{
  width:100%; max-width:230px; aspect-ratio:1/1; object-fit:cover; display:block; margin:0 auto;
  border:2.5px solid var(--ink); border-radius:14px; background:var(--chalk);
}
.ab-prompt{
  background:var(--indigo); border:2.5px solid var(--ink); border-radius:18px;
  box-shadow:5px 5px 0 var(--ink); padding:24px; text-align:center; color:var(--chalk);
}
.ab-mtword{
  font-family:'Baloo Bhaina 2',cursive; font-size:34px; font-weight:800; line-height:1.3;
  color:var(--chalk); margin:10px 0 2px;
}
.ab-word{font-family:'Baloo Bhaina 2',cursive; font-size:27px; font-weight:700; line-height:1.35;}
.ab-right{background:#DFF0D2 !important;}
.ab-wrong{background:#F7DAD5 !important;}
.ab-note{
  background:var(--rice-dk); border:2px dashed var(--bark); border-radius:12px;
  padding:11px 13px; font-size:13px; color:var(--bark);
}
.ab-chip{
  display:inline-block; border:2px solid var(--ink); border-radius:999px;
  padding:3px 11px; font-size:12px; font-weight:700; background:var(--chalk); white-space:nowrap;
}
.ab-chip.warn{background:var(--rice-dk); color:var(--bark);}
.ab-row{display:flex; align-items:center; gap:12px;}
.ab-grid2{display:grid; grid-template-columns:1fr 1fr; gap:13px;}
.ab-grid3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px;}
.ab-stack{display:flex; flex-direction:column; gap:12px;}
.ab-meter{height:9px; background:var(--rice-dk); border:2px solid var(--ink); border-radius:999px; overflow:hidden;}
.ab-meter i{display:block; height:100%;}

@media (prefers-reduced-motion: reduce){
  .ab-card,.ab-btn,.ab-walker,.ab-plank{transition:none !important;}
  .ab-card:active,.ab-btn:active{transform:none;}
}
